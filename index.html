 return{cats:c,orders:[],products:[p("Écouteurs sans fil Bluetooth","🎧",0,6000,12500,16500,"Autonomie 20 h, étui de charge, son clair."),p("Power bank 20 000 mAh","🔋",0,8000,15000,19500,"Recharge un smartphone 4 fois."),p("Montre connectée sport","⌚",0,9500,19000,25000,"Notifications, rythme cardiaque, étanche."),p("Lampe rechargeable solaire","💡",1,3500,8000,10500,"Idéale pendant les coupures de courant."),p("Ventilateur rechargeable","🌀",1,9000,18000,22500,"3 vitesses, batterie longue durée."),p("Blender portable","🥤",1,6500,13500,17000,"Smoothies partout, rechargeable USB."),p("Sérum capillaire nourrissant","🧴",2,2500,6000,8000,"Cheveux plus doux et brillants."),p("Sac à main tendance","👜",3,5000,11000,14500,"Simili cuir, fermeture zip."),p("Baskets confort","👟",3,7000,14500,0,"Légères, semelle souple.")]}};

const cat=id=>S.cats.find(c=>c.id===id),prod=id=>S.products.find(p=>p.id===id),act=()=>S.products.filter(p=>p.active);

 d.classList.add("on")}
